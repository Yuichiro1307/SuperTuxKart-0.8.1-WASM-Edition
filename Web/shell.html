<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SuperTuxKart 0.8.1</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #111; color: #eee; font: 14px sans-serif; }
    body { display: flex; flex-direction: column; }
    #status { padding: 8px 12px; min-height: 18px; }
    #canvas { display: block; flex: 1; width: 100%; min-height: 0; outline: none; }
  </style>
</head>
<body>
  <div id="status">Loading game and assets…</div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <script>
    var statusElement = document.getElementById("status");
    var Module = {
      canvas: document.getElementById("canvas"),
      setStatus: function(message) { statusElement.textContent = message; },
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
