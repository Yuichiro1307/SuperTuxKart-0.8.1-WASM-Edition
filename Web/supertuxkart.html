<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SuperTuxKart 0.8.1</title>
  <style>
    html, body { width: 100%; height: 100vh; height: 100dvh; margin: 0; overflow: hidden; background: #111; color: #eee; font: 14px sans-serif; }
    #status { position: fixed; z-index: 1; top: 0; left: 0; padding: 8px 12px; background: rgba(0, 0, 0, .65); }
    #status:empty { display: none; }
    #canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; }
  </style>
</head>
<body>
  <div id="status">Loading game and assets…</div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <script>
    var statusElement = document.getElementById("status");
    var Module = {
      canvas: document.getElementById("canvas"),
      setStatus: function(message) { statusElement.textContent = message; },
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); }
    };
  </script>
  <script async type="text/javascript" src="supertuxkart.js"></script>
</body>
</html>
