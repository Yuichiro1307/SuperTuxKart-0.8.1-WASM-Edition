<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SuperTuxKart 0.8.1</title>
  <style>
    html, body { width: 100%; height: 100vh; height: 100dvh; margin: 0; overflow: hidden; background: #111; color: #eee; font: 14px sans-serif; }
    #status { position: fixed; z-index: 1; top: 0; left: 0; padding: 8px 12px; background: rgba(0, 0, 0, .65); }
    #status:empty { display: none; }
    #audio-hint { display: none; position: fixed; z-index: 2; top: 12px; left: 50%; transform: translateX(-50%); padding: 10px 14px; border-radius: 4px; background: rgba(0, 0, 0, .75); }
    #canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; }
  </style>
</head>
<body>
  <div id="status">Loading game and assets…</div>
  <div id="audio-hint">Press a key or touch the screen to enable audio</div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <script>
    (function() {
      var prototype = window.WebGLRenderingContext &&
        window.WebGLRenderingContext.prototype;
      if (!prototype)
        return;

      var compileShader = prototype.compileShader;
      prototype.compileShader = function(shader) {
        compileShader.call(this, shader);
        if (!this.getShaderParameter(shader, this.COMPILE_STATUS)) {
          console.error("WebGL shader compilation failed:",
            this.getShaderInfoLog(shader), this.getShaderSource(shader));
        }
      };

      var linkProgram = prototype.linkProgram;
      prototype.linkProgram = function(program) {
        linkProgram.call(this, program);
        if (!this.getProgramParameter(program, this.LINK_STATUS)) {
          console.error("WebGL shader program linking failed:",
            this.getProgramInfoLog(program));
        }
      };
    })();

    var statusElement = document.getElementById("status");
    var audioHint = document.getElementById("audio-hint");
    var Module = {
      canvas: document.getElementById("canvas"),
      locateFile: function(path, prefix) {
        return prefix + path + "?v=7c0b022-20261111140531";
      },
      setStatus: function(message) { statusElement.textContent = message; },
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      onRuntimeInitialized: function() { audioHint.style.display = "block"; }
    };
    ["pointerdown", "keydown", "touchstart"].forEach(function(eventName) {
      document.addEventListener(eventName, function() {
        audioHint.style.display = "none";
      }, { once: true });
    });
  </script>
  <script async type="text/javascript" src="supertuxkart.js?v=7c0b022-20261111140531"></script>
</body>
</html>
